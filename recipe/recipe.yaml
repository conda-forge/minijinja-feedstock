# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.0.0"
  maturin_min: "1.9.4"
  maturin_max: "2"
  python_check_max: "3.14"
  cargo_wrapper: cargo-auditable-wrapper${{ ".sh" if unix else ".bat" }}

package:
  name: minijinja
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/m/minijinja/minijinja-${{ version }}.tar.gz
  sha256: 68b7dd99eb250fbd1c42edb05303d7137d4f3475aeeaae9d4efa6742c7ae0527

build:
  number: 0
  skip: is_abi3 and not is_python_min
  python:
    version_independent: ${{ is_abi3 }}
  script:
    env:
      CARGO_PROFILE_RELEASE_STRIP: symbols
      CARGO_PROFILE_RELEASE_LTO: fat
      CARGO: ${{ cargo_wrapper }}
      # for windows
      # ⚠ warning Error reading output: Custom { kind: InvalidData, error: "stream did not contain valid UTF-8" }
      PYTHONIOENCODING: utf-8
      PYTHONLEGACYTEXTENCODING: utf-8
    content:
      - if: win
        then:
          - copy "%RECIPE_DIR%\${{ cargo_wrapper }}" "%BUILD_PREFIX%\Library\bin\"
        else:
          - cp "${RECIPE_DIR}/${{ cargo_wrapper }}" "${BUILD_PREFIX}/bin/"
          - chmod 755 "${BUILD_PREFIX}/bin/${{ cargo_wrapper }}"
      - cargo-bundle-licenses --format=yaml --output=THIRDPARTY.yml
      - ${{ PYTHON }} -m pip install . -vv --no-build-isolation --no-deps --disable-pip-version-check --check-build-dependencies

requirements:
  build:
    - ${{ compiler("c") }}
    - ${{ compiler("rust") }}
    - ${{ stdlib("c") }}
    - cargo-auditable
    - cargo-bundle-licenses
  host:
    - maturin >=${{ maturin_min }},<${{ maturin_max}}
    - pip
    - python
    - if: is_abi3
      then:
        - python-abi3
        - python ${{ python_min }}.*
  run:
    - python
    - if: is_abi3
      then:
        - python-abi3
        - python >=${{ python_min }}

tests:
  - package_contents:
      strict: true
      files:
        - etc/conda/test-files/minijinja/**
      site_packages:
        - minijinja/**
        - minijinja-${{ version }}.dist-info/**
  - python:
      imports: minijinja
      pip_check: true
      python_version:
        - if: is_abi3
          then:
            - ${{ python_min }}.*
            - ${{ python_check_max }}.*
          else:
            - "*"
  - files:
      source:
        - minijinja-py/tests/
    requirements:
      run:
        - mypy
        - pytest-cov
        - if: is_abi3
          then:
            - abi3audit
    script:
      - cd minijinja-py
      - coverage run --source minijinja --branch -m pytest -vv --tb=long --color=yes
      - coverage report --show-missing --skip-covered --fail-under=84
      - mypy -p minijinja
      - if: is_abi3 and unix
        then: abi3audit -s -v --assume-minimum-abi3 ${{ python_min }} "${SP_DIR}/minijinja/lowlevel.abi3.so"
      - if: is_abi3 and win
        then: abi3audit -s -v --assume-minimum-abi3 ${{ python_min }} "%SP_DIR%\minijinja\lowlevel.pyd"

about:
  summary: An experimental Python binding of the Rust MiniJinja template engine.
  license: Apache-2.0
  license_file:
    - LICENSE
    - minijinja/LICENSE
    - THIRDPARTY.yml
  homepage: https://pypi.org/project/minijinja
  repository: https://github.com/mitsuhiko/minijinja

extra:
  recipe-maintainers:
    - synapticarbors
    - bollwyvl
